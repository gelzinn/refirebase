name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check existing version
        run: |
          existing_version=$(npm show refirebase version)
          target_version=$(jq -r '.version' packages/refirebase/package.json)
          if [ "$existing_version" == "$target_version" ]; then
            echo "Version $target_version already exists. Please update the version in packages/refirebase/package.json."
            exit 1
          fi

      - name: Build and Publish package
        run: |
          cd packages/refirebase
          if ! bun run build; then
            echo "Error: Failed to build the package."
            exit 1
          fi

          # Login to NPM
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          
          # Then publish with force flag
          if ! npm publish --access public; then
            echo "Error: Failed to publish the package."
            exit 1
          fi

          echo "Package published successfully. Version: $(jq -r '.version' package.json)"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
